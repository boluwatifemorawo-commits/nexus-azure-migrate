name: CI

on:
  # push:
  #   branches: [main]
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build

  plugins:
    # the claude, codex and gemini manifests in .claude-plugin, .agents and plugins/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Claude Code marketplace and plugin
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.306 plugin validate .
          npx --yes @anthropic-ai/claude-code@2.1.306 plugin validate plugins/nexus-azure-migrate
      - name: Gemini CLI extension
        run: npx --yes @google/gemini-cli@0.65.0 extensions validate .
      - name: Codex marketplace and plugin
        run: python3 .github/scripts/check_plugins.py

  integration:
    # downloads from a real nexus 3. Uploading needs an azure feed, so it is not run here.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: docker compose up -d --wait
      - run: uv run python tests/integration/seed_nexus.py
      - name: Download every seeded package
        env:
          NEXUS_URL: http://localhost:8081
          NEXUS_PASSWORD: admin123
        run: |
          uv run nexus-azure-migrate migrate -f '(pypi|npm|nuget|maven2)' -r hosted -a download
          test "$(find nexus-packages -name '*.whl' | wc -l)" -eq 3
          test "$(find nexus-packages -name '*.tgz' | wc -l)" -eq 6
          test "$(find nexus-packages -name '*.nupkg' | wc -l)" -eq 3
          test "$(find nexus-packages -name '*.jar' | wc -l)" -eq 3

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          tags: nexus-azure-migrate:ci
