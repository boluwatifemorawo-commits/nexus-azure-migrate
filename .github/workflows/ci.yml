name: CI

on:
  # push:
  #   branches: [main]
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build

  integration:
    # downloads from a real nexus 3. Uploading needs an azure feed, so it is not run here.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: docker compose up -d --wait
      - run: uv run python tests/integration/seed_nexus.py
      - name: Download every seeded package
        env:
          NEXUS_URL: http://localhost:8081
          NEXUS_PASSWORD: admin123
        run: |
          uv run nexus-azure-migrate migrate -f '(pypi|npm|nuget|maven2)' -r hosted -a download
          test "$(find nexus-packages -name '*.whl' | wc -l)" -eq 3
          test "$(find nexus-packages -name '*.tgz' | wc -l)" -eq 6
          test "$(find nexus-packages -name '*.nupkg' | wc -l)" -eq 3
          test "$(find nexus-packages -name '*.jar' | wc -l)" -eq 3

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: false
          tags: nexus-azure-migrate:ci
