name: Release

# Every push to main is released. Alpha by default, a full release when the
# commit message contains #release. See "Releasing" in the README.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest

      - name: Release or alpha
        id: kind
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if grep -q '#release' <<< "$MESSAGE"; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      # bumps patch by default, #minor or #major in the commit message overrides it
      - name: Tag
        id: tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
          INITIAL_VERSION: 0.1.0
          PRERELEASE: ${{ steps.kind.outputs.prerelease }}
          PRERELEASE_SUFFIX: alpha

      # semver 0.1.1-alpha.0 -> PEP 440 0.1.1a0
      - name: Build
        env:
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          version="$(sed -e 's/^v//' -e 's/-alpha\./a/' <<< "$TAG")"
          uv version --frozen "$version"
          uv build

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          prerelease: ${{ steps.kind.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*

      - name: Publish to PyPI
        if: steps.kind.outputs.prerelease == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
