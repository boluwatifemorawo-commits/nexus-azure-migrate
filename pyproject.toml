[project]
name = "nexus-azure-migrate"
version = "0.1.0"
description = "flexible cli for migrating supported artifacts from nexus2/3 to Azure artifacts"
readme = "README.md"
authors = [
    { name = "Boluwatife Morawo" }
]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "requests>=2.34.2",
    "rich>=15.0.0",
    "semver>=3.1.0",
    # used to upload pypi packages
    "twine>=7.0.0",
    "typer>=0.27.2",
]

[project.scripts]
nexus-azure-migrate = "nexus_azure_migrate:app"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the docker compose nexus (see tests/integration)"]
addopts = "-m 'not integration'"
